name: memo
version: 0.15.6

description: |
  Memo - Semantic search and vector storage library for Crystal.
  Provides chunking, embedding storage, similarity search, and RRF fusion.

authors:
  - trans

repository: https://github.com/openbohemians/memo

crystal: ">= 1.19.1"

dependencies:
  db:
    github: crystal-lang/crystal-db
  sqlite3:
    github: crystal-lang/crystal-sqlite3
  # Only the memo CLI uses jargon, and it needs 0.19 or later (shard.lock
  # has 0.22.2). The floor stays at 0.16 so projects pinned to jargon 0.16,
  # directly or through artistry, can still use memo as a library.
  jargon:
    github: openbohemians/jargon.cr
    version: ~> 0.16
  ignore:
    github: trans/ignore
    version: ~> 0.4
  magic:
    github: naqvis/magic.cr
  usearch:
    github: trans/usearch.cr
    version: ~> 0.1
  arcana-core:
    github: trans/arcana-core
    version: ~> 0.20.0
  arcana-ai:
    github: trans/arcana-ai
    version: ~> 0.6.1
  markterm:
    github: ralsina/markterm
    version: 0.6.3
  pg:
    github: will/crystal-pg
    version: ~> 0.31.0

targets:
  memo:
    main: bin/memo.cr
  memo-arcana:
    main: bin/memo-arcana.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

license: MIT
