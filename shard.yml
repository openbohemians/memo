name: memo
version: 0.12.1

description: |
  Memo - Semantic search and vector storage library for Crystal.
  Provides chunking, embedding storage, similarity search, and RRF fusion.

authors:
  - trans

repository: https://github.com/trans/memo

crystal: ">= 1.10.0"

dependencies:
  db:
    github: crystal-lang/crystal-db
  sqlite3:
    github: crystal-lang/crystal-sqlite3
  jargon:
    github: trans/jargon
    version: ~> 0.16
  ignore:
    github: trans/ignore
    version: ~> 0.4
  magic:
    github: naqvis/magic.cr
  usearch:
    github: trans/usearch.cr
    version: ~> 0.1
  arcana:
    github: trans/arcana
    version: ~> 0.17.0
  arcana-core:
    github: trans/arcana-core
    version: ~> 0.5.1
  markterm:
    github: ralsina/markterm
    version: 0.6.3
  pg:
    github: will/crystal-pg
    branch: master

targets:
  memo:
    main: bin/memo.cr
  memo-arcana:
    main: bin/memo-arcana.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

license: MIT
